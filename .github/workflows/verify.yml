name: Verify ordered set partitions at threshold four
on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'paper/**'
      - 'verification/**'
      - 'SHA256SUMS'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'paper/**'
      - 'verification/**'
      - 'SHA256SUMS'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threshold-four-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-threshold-four:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check archived inputs and replay integer and rational certificates
        run: |
          receipts="$RUNNER_TEMP/threshold-four-receipts"
          mkdir "$receipts"
          sha256sum --check SHA256SUMS | tee "$receipts/artifact-hashes.log"
          (cd formal && sha256sum --check SOURCE-SHA256SUMS) | tee "$receipts/source-hashes.log"
          (
            cd paper
            python3 -IB anc/analytic/boxes.py
            python3 -IB anc/analytic/arithmetic.py
            python3 -IB anc/analytic/certificate.py
            python3 -IB anc/finite/verify.py anc/finite/intervals-287.json --max-old 287 \
              > "$receipts/finite-result.json"
            cmp anc/finite/result-287.json "$receipts/finite-result.json"
            cat "$receipts/finite-result.json"
          ) 2>&1 | tee "$receipts/arithmetic.log"
          deps="$(mktemp -d "$RUNNER_TEMP/threshold-four-deps.XXXXXXXX")"
          cp formal/{lean-toolchain,lakefile.toml,lake-manifest.json} "$deps/"
          printf 'THRESHOLD_FOUR_DEPS=%s\n' "$deps" >> "$GITHUB_ENV"

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: ${{ env.THRESHOLD_FOUR_DEPS }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

      - name: Retrieve the locked external dependency objects
        run: |
          receipts="$RUNNER_TEMP/threshold-four-receipts"
          grep -rhE '^import Mathlib(\.[A-Za-z_][A-Za-z_0-9]*)*$' --include='*.lean' formal/OrderedPartitions |
            cut -d' ' -f2 | sort -u > "$receipts/mathlib-cache-roots.txt"
          mapfile -t imports < "$receipts/mathlib-cache-roots.txt"
          test "${#imports[@]}" -gt 0
          (
            cd "$THRESHOLD_FOUR_DEPS"
            lake exe cache get "${imports[@]}"
          ) 2>&1 | tee "$receipts/mathlib-cache.log"
          cmp formal/lake-manifest.json "$THRESHOLD_FOUR_DEPS/lake-manifest.json"

      - name: Cold-build and independently replay the paper proof
        run: |
          if ! ulimit -Sn 65536 2>/dev/null; then
            printf 'Keeping the current open-file limit of %s\n' "$(ulimit -Sn)"
          fi
          receipts="$RUNNER_TEMP/threshold-four-receipts"
          test ! -e formal/.lake
          python3 -Bu formal/verify.py "$THRESHOLD_FOUR_DEPS/.lake/packages" 1 \
            2>&1 | tee "$receipts/lean-cold.log"
          modules=$(wc -l < formal/modules.txt)
          grep -E "^PASS $modules cold project modules, $modules independent kernel replays, [0-9]+ source axiom reports and 6 targeted reports$" "$receipts/lean-cold.log"
          {
            printf 'module\tsource_sha256\tobject_sha256\n'
            sed -nE 's/^kernel_replay_exit=0 ([^ ]+) source_sha256=([0-9a-f]+) object_sha256=([0-9a-f]+)$/\1\t\2\t\3/p' "$receipts/lean-cold.log"
          } > "$receipts/module-receipts.tsv"
          test "$(wc -l < "$receipts/module-receipts.tsv")" -eq "$((modules + 1))"
          if [[ -f verification/module-receipts.tsv ]]; then
            cmp verification/module-receipts.tsv "$receipts/module-receipts.tsv"
          fi

      - name: Save verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: threshold-four-verification
          path: ${{ runner.temp }}/threshold-four-receipts/
          if-no-files-found: warn
          retention-days: 14
